<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Reset password · S333XHUB</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='12'%20fill='%23000'/%3E%3Crect%20x='29'%20y='11'%20width='6'%20height='42'%20fill='%23fff'/%3E%3Crect%20x='17'%20y='23'%20width='30'%20height='6'%20fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="site.css" />
</head>
<body class="auth">
  <main>
    <h1><a href="index.html">S333XHUB</a></h1>
    <p class="lead">Reset password</p>
    <div id="form" hidden>
      <input id="pw1" type="password" placeholder="New password (8+ characters)" autocomplete="new-password" />
      <input id="pw2" type="password" placeholder="Repeat new password" autocomplete="new-password" />
      <button id="save" type="button">Set new password</button>
    </div>
    <p class="msg" id="msg">Checking your reset link.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const client = window.supabase.createClient(
      'https://nxvxfpuwlkfwyvmuqjge.supabase.co',
      'sb_publishable_jFLySbaQkZ26qcM4Rg5Avw_3c5IG0jK'
    );
    const msg = document.getElementById('msg');
    const form = document.getElementById('form');
    const save = document.getElementById('save');

    const EXPIRED =
      'This link has expired or was already used. Open S333XHUB, tap Forgot password, and request a new one.';

    function show(text, cls) { msg.textContent = text; msg.className = 'msg ' + (cls || ''); }

    // If verification failed, Supabase sends the reason in the URL hash.
    // It is logged, never shown.
    const hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
    const urlError = hashParams.get('error_description') || hashParams.get('error');

    let verified = false;
    if (urlError) {
      console.warn('[reset-password]', urlError.replace(/\+/g, ' '));
      show(EXPIRED, 'err');
    } else {
      // The email link lands here with a recovery session in the URL. The
      // client library picks it up automatically.
      client.auth.onAuthStateChange((event, session) => {
        if (session && !verified) {
          verified = true;
          form.hidden = false;
          show('Choose a new password.');
        }
      });
      setTimeout(async () => {
        const { data } = await client.auth.getSession();
        if (!data.session && form.hidden) show(EXPIRED, 'err');
      }, 3500);
    }

    save.addEventListener('click', async () => {
      const pw1 = document.getElementById('pw1').value;
      const pw2 = document.getElementById('pw2').value;
      if (pw1.length < 8) return show('Password needs at least 8 characters.', 'err');
      if (pw1 !== pw2) return show('Those passwords do not match.', 'err');
      save.disabled = true;
      const { error } = await client.auth.updateUser({ password: pw1 });
      if (error) {
        save.disabled = false;
        console.warn('[reset-password]', error.code, error.message);
        if (error.code === 'same_password') {
          return show('That is your current password. Choose a different one.', 'err');
        }
        if (error.code === 'weak_password') {
          return show('That password is too easy to guess. Try a longer one.', 'err');
        }
        return show(EXPIRED, 'err');
      }
      form.hidden = true;
      show('Password changed. Open S333XHUB and sign in.', 'ok');
      client.auth.signOut();
    });
  </script>
</body>
</html>
