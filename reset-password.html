<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Reset password — S333XHUB</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0b0c0e; color: #f4f5f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px; box-sizing: border-box;
    }
    .card { width: 100%; max-width: 380px; text-align: center; }
    h1 { font-size: 30px; letter-spacing: 4px; margin: 0 0 4px; }
    .sub { color: #9a9ba3; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 30px; }
    input {
      width: 100%; box-sizing: border-box; background: #131519; color: #fff; border: 0;
      border-radius: 14px; padding: 16px; font-size: 16px; margin-bottom: 12px; outline: none;
    }
    button {
      width: 100%; background: #fff; color: #0b0c0e; border: 0; border-radius: 999px;
      padding: 16px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px;
    }
    button:disabled { opacity: 0.4; }
    .msg { margin-top: 14px; font-size: 14px; line-height: 1.5; }
    .err { color: #ff6b6b; }
    .ok { color: #4fc07a; }
    .muted { color: #9a9ba3; }
  </style>
</head>
<body>
  <div class="card">
    <h1>S333XHUB</h1>
    <div class="sub">Reset password</div>
    <div id="form" hidden>
      <input id="pw1" type="password" placeholder="New password (8+ characters)" autocomplete="new-password" />
      <input id="pw2" type="password" placeholder="Repeat new password" autocomplete="new-password" />
      <button id="save">Set new password</button>
    </div>
    <div class="msg" id="msg">Checking your reset link…</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const supabase = window.supabase.createClient(
      'https://nxvxfpuwlkfwyvmuqjge.supabase.co',
      'sb_publishable_jFLySbaQkZ26qcM4Rg5Avw_3c5IG0jK'
    );
    const msg = document.getElementById('msg');
    const form = document.getElementById('form');
    const save = document.getElementById('save');

    function show(text, cls) { msg.textContent = text; msg.className = 'msg ' + (cls || 'muted'); }

    // The email link lands here with a recovery session in the URL —
    // the client library picks it up automatically.
    supabase.auth.onAuthStateChange((event, session) => {
      if (session) {
        form.hidden = false;
        show('You are verified — choose a new password.', 'muted');
      }
    });
    setTimeout(async () => {
      const { data } = await supabase.auth.getSession();
      if (!data.session && form.hidden) {
        show('This reset link is invalid or expired. Go back to the app and request a new one.', 'err');
      }
    }, 2500);

    save.addEventListener('click', async () => {
      const pw1 = document.getElementById('pw1').value;
      const pw2 = document.getElementById('pw2').value;
      if (pw1.length < 8) return show('Password needs at least 8 characters.', 'err');
      if (pw1 !== pw2) return show('Those passwords do not match.', 'err');
      save.disabled = true;
      const { error } = await supabase.auth.updateUser({ password: pw1 });
      if (error) {
        save.disabled = false;
        return show(error.message, 'err');
      }
      form.hidden = true;
      show('Done — your password is changed. Open S333XHUB and sign in with it.', 'ok');
      supabase.auth.signOut();
    });
  </script>
</body>
</html>
