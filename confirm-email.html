<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Email confirmed — S333XHUB</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0b0c0e; color: #f4f5f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px; box-sizing: border-box; text-align: center;
    }
    .card { max-width: 380px; }
    h1 { font-size: 30px; letter-spacing: 4px; margin: 0 0 4px; }
    .sub { color: #9a9ba3; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 30px; }
    .big { font-size: 44px; margin-bottom: 14px; }
    p { color: #cbcdd1; font-size: 15px; line-height: 1.6; }
    .err { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>S333XHUB</h1>
    <div class="sub">Email confirmation</div>
    <div class="big" id="mark">…</div>
    <p id="msg">Checking your confirmation link…</p>
  </div>
  <script>
    // Supabase's verify endpoint redirects here after confirming; a failure
    // arrives as #error_description in the hash.
    const params = new URLSearchParams(location.hash.replace(/^#/, ''));
    const error = params.get('error_description') || params.get('error');
    const mark = document.getElementById('mark');
    const msg = document.getElementById('msg');
    if (error) {
      mark.textContent = '✕';
      msg.className = 'err';
      msg.textContent = 'This link did not work: ' + error.replace(/\+/g, ' ') +
        '. Open the app and sign up again to get a fresh one.';
    } else {
      mark.textContent = '🖤';
      msg.textContent = 'Your email is confirmed. Open S333XHUB and sign in — welcome to the family.';
    }
  </script>
</body>
</html>
